version: "3.8"

services:

  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgresql:
    image: postgres:12
    ports:
      - "5432:5432"
    environment:
      # default values for development purposes only
      - POSTGRES_USER=xcmetrics-dev
      - POSTGRES_PASSWORD=xcmetrics-dev
      - POSTGRES_DB=xcmetrics-dev
      - PGDATA=/data/postgres-xcmetrics
    volumes:
      - postgres:/data/postgres-xcmetrics
    healthcheck:
      test: pg_isready -U xcmetrics-dev -d xcmetrics-dev
      interval: 10s
      timeout: 3s
      retries: 3

  xcmetrics:
    # Integration branch: build from this working tree rather than pulling
    # Spotify's published image, which predates these changes.
    build: .
    image: xcmetrics:local
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - XCMETRICS_START_JOBS_SAME_INSTANCE=1
      - XCMETRICS_USE_ASYNC_LOG_PROCESSING=1
      - XCMETRICS_REDACT_USER_DATA=1
      - XCMETRICS_USE_GCS_REPOSITORY=0
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - DB_HOST=postgresql

  # Scheduled statistics aggregation. The Backstage plugin and the
  # /v1/statistics/* endpoints read tables this job populates. Vapor only fires
  # scheduled jobs inside a `queues --scheduled` worker, so it cannot run in the
  # `serve` container above. Mirrors DeploymentExamples/MultiInstances/
  # xcmetrics-scheduled-jobs-deployment.yaml.
  xcmetrics-jobs:
    build: .
    image: xcmetrics:local
    command: ["queues", "--scheduled", "--env", "production"]
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      - XCMETRICS_SCHEDULE_STATISTICS_JOBS=1
      - XCMETRICS_START_JOBS_SAME_INSTANCE=0
      - XCMETRICS_USE_ASYNC_LOG_PROCESSING=1
      - XCMETRICS_REDACT_USER_DATA=1
      - XCMETRICS_USE_GCS_REPOSITORY=0
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - DB_HOST=postgresql

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # Local-only convenience: no login prompt when kicking the tires.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./local/grafana/provisioning:/etc/grafana/provisioning

volumes:
  postgres:
